services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: octaship
      POSTGRES_PASSWORD: octaship
      POSTGRES_DB: octaship
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./dev.db
    volumes:
      - ./dev.db:/app/dev.db
    depends_on:
      - db

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://octaship:octaship@db:5432/octaship
      BACKEND_URL: http://backend:8000
    depends_on:
      - db
      - backend

volumes:
  pgdata:
