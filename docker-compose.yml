services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: traderoute
      POSTGRES_PASSWORD: traderoute
      POSTGRES_DB: traderoute
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://traderoute:traderoute@db:5432/traderoute
    depends_on:
      - db

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TRADEROUTE_DATABASE_URL: postgresql+asyncpg://traderoute:traderoute@db:5432/traderoute
      TRADEROUTE_SECRET_KEY: change-me-in-production
      TRADEROUTE_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    depends_on:
      - db

volumes:
  pgdata:
